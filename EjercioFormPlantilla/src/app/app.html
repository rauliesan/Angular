<style>

  h1 {
    font-size: 3.125rem;
    color: var(--gray-900);
    font-weight: 500;
    line-height: 100%;
    letter-spacing: -0.125rem;
    margin: 0;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
  }

  p {
    margin: 0;
    color: var(--gray-700);
  }

  main {
    width: 100%;
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    box-sizing: inherit;
    position: relative;
  }

  .angular-logo {
    max-width: 9.2rem;
  }

  .content {
    display: flex;
    justify-content: space-around;
    width: 100%;
    max-width: 700px;
    margin-bottom: 3rem;
  }

  .content h1 {
    margin-top: 1.75rem;
  }

  .content p {
    margin-top: 1.5rem;
  }

</style>

<main class="main">
  <div class="content">
    <table>
      <tr>
        <th>Código</th>
        <th>Descripción</th>
        <th>Precio</th>
      </tr>
      @for (articulo of articulos; track articulo.codigo) {
        <tr>
          <td>{{articulo.codigo}}</td>
          <td>{{articulo.descripcion}}</td>
          <td>{{articulo.precio}}</td>
          <td><button (click)="borrar(articulo.codigo)">Borrar</button></td>
          <td><button (click)="seleccionar(articulo.codigo)">Seleccionar</button></td>
        </tr>
      }
    </table>
    <div>
      <label for="">Código: </label>
      <input type="number" [(ngModel)]="art.codigo">
      <label for="">Descripción: </label>
      <input type="text" [(ngModel)]="art.descripcion">
      <label for="">Precio: </label>
      <input type="number" [(ngModel)]="art.precio">
      <button>Agregar</button>
      <button>Modificar</button>
    </div>
  </div>
</main>

<router-outlet />
