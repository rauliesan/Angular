<h1>Mis tareas</h1>

<app-todo-form
  [maxCaracteres]="30"
  (tareaCreada)="agregarTarea($event)">
</app-todo-form>

<ul>
    @for (tarea of tareas; track tarea.id) {
      <li class="mt-3 mb-3">
        {{ tarea.titulo }}
        <button (click)="eliminarTarea(tarea.id)" class="btn btn-danger">❌</button>
      </li>
    }
</ul>
