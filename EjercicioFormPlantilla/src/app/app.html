<style>

  h1 {
    font-size: 3rem;
    font-weight: 500;
    line-height: 100%;
    letter-spacing: -0.125rem;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
      "Segoe UI Symbol";
  }

  p {
    margin: 0;
  }

  main {
    width: 100%;
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: inherit;
    position: relative;
    
  }

  .content {
    width: 100%;
    margin-bottom: 3rem;
  }

  .content h1 {
    margin-top: 1.75rem;
  }

  .content p {
    margin-top: 1.5rem;
  }

  .form>input, .form>button{
    margin-right: 0.5em;
  }

</style>

<main class="main">
  <div class="content">
    <h1>Administración de Artículos</h1>
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th>Borrar</th>
          <th>Seleccionar</th>
        </tr>
      </thead>
      <tbody>
        @for (articulo of articulos; track articulo.codigo) {
          <tr>
            <td>{{articulo.codigo}}</td>
            <td>{{articulo.descripcion}}</td>
            <td>{{articulo.precio}}</td>
            <td><button (click)="borrar(articulo.codigo)">Borrar</button></td>
            <td><button (click)="seleccionar(articulo.codigo)">Seleccionar</button></td>
          </tr>
        }
      </tbody>
      
    </table>
    <div class="form">
      <label for="">Código: </label>
      <input type="number" [(ngModel)]="art.codigo">
      <label for="">Descripción: </label>
      <input type="text" [(ngModel)]="art.descripcion">
      <label for="">Precio: </label>
      <input type="number" [(ngModel)]="art.precio">
      <button (click)="agregar()">Agregar</button>
      <button (click)="modificar()">Modificar</button>
    </div>
  </div>
</main>

<router-outlet />
